name: Weekly Multi-Journal Digest

# Every Monday 01:00 UTC = 09:00 Beijing Time. Cron is UTC; BJT = UTC + 8h.
# Note: scheduled runs may be delayed by 5-30 minutes under heavy load.
on:
  schedule:
    - cron: "0 1 * * 1"
  workflow_dispatch:
    inputs:
      days_back:
        description: "Days back to look for articles (default 8)"
        required: false
        default: "8"

jobs:
  send-digest:
    runs-on: ubuntu-latest
    # Extended from 10 to 30 minutes because 8 journals + translation
    # can take 10-15 minutes total.
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run digest job
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          RECIPIENT: ${{ secrets.RECIPIENT }}
          DAYS_BACK: ${{ inputs.days_back || '8' }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          PYTHONUNBUFFERED: "1"
        run: python -m src.main

      - name: Upload generated document as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ github.run_id }}
          path: output/*.docx
          retention-days: 30
          if-no-files-found: warn
